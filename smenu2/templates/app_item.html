<div class="swiper-slide container">
  <div class="menu-card">
    <img id="${app_icon_id}" class="img-medium" src="${app_icon}" />
    <span class="anim-tag" data-anim>${app_is_system}</span>
    <h2 class="anim-title" data-anim>${app_name}</h2>
    <p class="anim-desc" data-anim>
      ${app_category} <br />
      ${app_is_online} ${app_is_offline}<br />
    </p>
    <div class="button-column">
      <button
        class="anim-btn"
        onClick="${app_button_play}"
        id="${app_play_id}"
        data-name="${app_name}"
        data-anim
      >
        PLAY
      </button>
    </div>
  </div>
</div>
