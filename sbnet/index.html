<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>My Web Page</title>
    <link rel="stylesheet" href="./game.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body onload="onLoadEvent()">
    <div class="loading-overlay" id="screen_blocker_id"></div>
    <div id="user_time_id" class="horizontal-dock"></div>
    <dialog
      id="coinModal"
      class="game-modal"
      data-augmented-ui="tl-clip-x br-clip-x b-clip-x both"
    ></dialog>
    <script src="obrajs.js"></script>
    <script src="taraKiosk.js"></script>
    <script src="index.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sloader2/sw.js")
            .then((registration) => {
              console.log("SW registered successfully:", registration.scope);
              setInterval(() => {
                if (registration.active) {
                  registration.active.postMessage({ type: "PING" });
                }
              }, 25000);
            })
            .catch((error) => {
              console.error("SW registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
