<div class="app-item">
  <img src="${app_icon}" alt="App Icon" class="app-icon" />
  <div class="app-details">
    <span class="app-title">${app_title}</span>
    <span class="app-desc">${app_category}</span>
  </div>
  <button
    class="item-close-btn"
    aria-label="Dismiss notification"
    id="${app_id}"
    onclick="${app_button}"
  >
    &times;
  </button>
</div>
