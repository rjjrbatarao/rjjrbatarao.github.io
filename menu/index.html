    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
    <!-- Initialize Swiper -->
    <script src="./index.js"></script>
	<script>
      // Register the service worker
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/menu/sw.js')
            .then((registration) => {
                console.log('SW registered successfully:', registration.scope);
                
                // Keep-Alive Heartbeat: Pings the Service Worker every 25 seconds
                setInterval(() => {
                    if (registration.active) {
                        registration.active.postMessage({ type: 'PING' });
                    }
                }, 25000);
            })
            .catch((error) => {
                console.error('SW registration failed:', error);
            });
    });
}
    </script>
