<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-polyfills/0.1.43/polyfill.js"></script>
    <script src="./obrajs.js"></script>
    <link rel="shortcut icon" href="data:," />
    <!-- X styles -->
    <link rel="stylesheet" href="style.css"></link>
  </head>

  <body>
    <!-- Swiper  -->
<div class="wave">
  <div class="wave--one"></div>
  <div class="wave--two"></div>
  <div class="wave--three"></div>
</div>  
    <div id="header"></div>
    <div  class="x-hero">
      <div>
          <svg
      width="64px"
      height="64px"
      viewBox="0 0 16 16"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      stroke="#ffffff"
    >
      <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
      <g
        id="SVGRepo_tracerCarrier"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></g>
      <g id="SVGRepo_iconCarrier">
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM7 3V8.41421L10.2929 11.7071L11.7071 10.2929L9 7.58579V3H7Z"
          fill="#ffffff"
        ></path>
      </g>
    </svg>
    <span class="x-time">
        &nbsp;11:00:00
    </span>
      </div>
    </div>
    <div id="app" class="x-center"></div>
    
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
    <!-- Initialize Swiper -->
    <script src="./index.js"></script>
    
  </body>
</html>
