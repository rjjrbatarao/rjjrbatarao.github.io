<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-polyfills/0.1.43/polyfill.js"></script>
    <script src="./obrajs.js"></script>
    <link rel="shortcut icon" href="data:," />
    <!-- X styles -->
    <link rel="stylesheet" href="style.css"></link>
  </head>

  <body>
    <!-- Swiper  -->
<div class="wave">
  <div class="wave--one"></div>
  <div class="wave--two"></div>
  <div class="wave--three"></div>
</div>  
    <div id="header"></div>
    <!-- <div  class="x-hero">
      <div class="x-card x-font-smaller">
        <p class="x-center-items">
            <span id="ipaddress_id"></span><br/>
            <span id="devicemodel_id"></span><br/>
            <span id="appversion_id"></span><br/>
        </p>
      </div>
    </div> -->
    <div  class="x-hero">
    </div>
    
    <div class="swiper xsmall-swiper">
      <div class="swiper-wrapper"> 
        <div class="swiper-slide">A</div>
        <div class="swiper-slide">B</div>
        <div class="swiper-slide">C</div>
        <div class="swiper-slide">D</div>
        <div class="swiper-slide">E</div>
        <div class="swiper-slide">F</div>
        <div class="swiper-slide">G</div>
        <div class="swiper-slide">H</div>
        <div class="swiper-slide">I</div>
        <div class="swiper-slide">J</div>
        <div class="swiper-slide">K</div>
        <div class="swiper-slide">L</div>
        <div class="swiper-slide">M</div>
        <div class="swiper-slide">N</div>
        <div class="swiper-slide">O</div>
        <div class="swiper-slide">P</div>
        <div class="swiper-slide">Q</div>
        <div class="swiper-slide">R</div>
        <div class="swiper-slide">S</div>
        <div class="swiper-slide">T</div>
        <div class="swiper-slide">U</div>
        <div class="swiper-slide">V</div>
        <div class="swiper-slide">W</div>
        <div class="swiper-slide">X</div>
        <div class="swiper-slide">Y</div>
        <div class="swiper-slide">Z</div>
      </div>
    </div>

    <div id="app_id" class="x-center"></div>
    <div id="marqueue_id"></div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
    <!-- Initialize Swiper -->
    <script src="./index.js"></script>
	<script>
      // Register the service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/menu/sw.js')
            .then(reg => console.log('SW Registered', reg.scope))
            .catch(err => console.error('SW Registration failed', err));
        });
      }
    </script>
	
  </body>
</html>
